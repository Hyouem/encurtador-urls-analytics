spring.application.name=encurtador-urls-analytics
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15434/shortener}
spring.datasource.username=${DB_USER:shortener}
spring.datasource.password=${DB_PASSWORD:shortener}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}